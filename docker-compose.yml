version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: marshall-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - marshall-net

  minio:
    image: minio/minio:latest
    container_name: marshall-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - marshall-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: marshall-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '1025']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - marshall-net

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  marshall-net:
    driver: bridge
